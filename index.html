<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Musica">
<meta name="theme-color" content="#121212">
<title>La mia Musica</title>
<style>
:root{--bg:#000;--panel:#121212;--card:#1a1a1a;--hover:#2a2a2a;--text:#fff;--muted:#a7a7a7;--accent:#1ed760;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{width:1em;height:1em;fill:currentColor;display:block}
#app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:1fr 90px;gap:8px;padding:8px;height:100%}
#side{background:var(--panel);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;grid-row:1}
#side h1{font-size:20px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
#side h1 i{color:var(--accent);font-size:26px}
.nav{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:600;width:100%;text-align:left}
.nav:hover{color:var(--text)}
.nav.on{color:var(--text);background:var(--hover)}
.nav svg{font-size:22px;flex:none}
.nav span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sep{height:1px;background:var(--hover);margin:10px 0}
.sidehead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:700;padding:4px 12px;text-transform:uppercase;letter-spacing:.05em}
.sidehead button{font-size:20px;padding:2px}
.sidehead button:hover{color:var(--text)}
#main{background:linear-gradient(#2b2b2b 0,var(--panel) 260px);border-radius:10px;overflow-y:auto;grid-row:1;position:relative}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:14px 24px;background:linear-gradient(#2b2b2bee,#2b2b2b00)}
.search{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:#242424;border-radius:30px;padding:10px 16px}
.search svg{color:var(--muted);font-size:18px}
.search input{background:none;border:0;outline:0;width:100%;font-size:14px}
.btn{background:var(--text);color:#000;font-weight:700;border-radius:30px;padding:10px 18px;font-size:14px;white-space:nowrap}
.btn:hover{transform:scale(1.03)}
.btn.g{background:var(--accent)}
.hero{display:flex;align-items:flex-end;gap:22px;padding:10px 24px 22px}
.hero .cv{width:180px;height:180px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:70px;box-shadow:0 8px 40px #0008}
.hero small{font-weight:700;font-size:12px;text-transform:uppercase}
.hero h2{font-size:clamp(28px,5vw,56px);line-height:1.05;margin:6px 0 10px;word-break:break-word}
.hero p{color:var(--muted);font-size:14px}
.actions{display:flex;align-items:center;gap:18px;padding:0 24px 16px}
.play-big{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;font-size:26px}
.play-big:hover{transform:scale(1.06)}
.icon{font-size:22px;color:var(--muted);padding:6px;border-radius:50%}
.icon:hover{color:var(--text)}
.icon.on{color:var(--accent)}
.list{padding:0 12px 30px}
.row{display:grid;grid-template-columns:36px 1fr 60px 120px;align-items:center;gap:12px;padding:6px 12px;border-radius:6px;color:var(--muted);font-size:14px}
.row:hover{background:#ffffff14}
.row.cur .t b{color:var(--accent)}
.row .n{text-align:center;font-variant-numeric:tabular-nums}
.row .pl{display:none;font-size:18px;color:var(--text);justify-self:center}
.row:hover .n{display:none}.row:hover .pl{display:block}
.row .t{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.row .t .cv{width:40px;height:40px;border-radius:4px;flex:none;display:grid;place-items:center;font-size:18px}
.row .t div{min-width:0}
.row .t b{display:block;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ac{display:flex;justify-content:flex-end;gap:2px}
.row .ac button{font-size:18px;padding:6px;color:var(--muted);border-radius:50%}
.row .ac button:hover{color:var(--text)}
.row .ac button.on{color:var(--accent)}
.hd{border-bottom:1px solid #ffffff1a;border-radius:0;margin-bottom:6px;text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.hd:hover{background:none}
.empty{text-align:center;color:var(--muted);padding:70px 24px}
.empty h3{color:var(--text);font-size:22px;margin-bottom:8px}
.empty p{margin-bottom:20px}
.drop{position:fixed;inset:0;background:#000c;z-index:50;display:none;place-items:center;font-size:26px;font-weight:700;border:4px dashed var(--accent);pointer-events:none}
.drop.on{display:grid}
#bar{grid-column:1/3;background:var(--bg);display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:12px;padding:0 10px}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np .cv{width:56px;height:56px;border-radius:4px;flex:none;display:grid;place-items:center;font-size:24px}
.np div{min-width:0}
.np b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.np span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.btns{display:flex;align-items:center;gap:14px}
.btns .icon{font-size:20px}
.btns .pp{width:36px;height:36px;border-radius:50%;background:var(--text);color:#000;display:grid;place-items:center;font-size:18px;padding:0}
.btns .pp:hover{transform:scale(1.06)}
.seek{display:flex;align-items:center;gap:8px;width:100%;max-width:620px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.vol{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.vol input{width:100px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--text) var(--p,0%),#4d4d4d var(--p,0%));outline:0;cursor:pointer;flex:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
input[type=range]:hover{background:linear-gradient(to right,var(--accent) var(--p,0%),#4d4d4d var(--p,0%))}
input[type=range]:hover::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
.pop{position:fixed;z-index:60;background:#282828;border-radius:8px;padding:6px;min-width:200px;box-shadow:0 10px 40px #000a;max-height:50vh;overflow-y:auto}
.pop button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:4px;font-size:14px}
.pop button:hover{background:#ffffff1a}
.pop .lbl{padding:8px 12px;font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--accent);color:#000;font-weight:700;padding:10px 18px;border-radius:30px;z-index:70;font-size:14px;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
#tabs,#mini,#full{display:none}

/* ===== MOBILE / iPHONE ===== */
@media (max-width:760px){
 html,body{overflow:hidden}
 #app{display:block;padding:0;height:100%}
 #side{display:none}
 #bar{display:none}
 #main{border-radius:0;height:100%;padding-bottom:calc(130px + var(--safe-b))}
 .top{padding:calc(12px + var(--safe-t)) 14px 10px}
 .search{max-width:none}
 .btn.hide-m{display:none}
 .hero{flex-direction:column;align-items:center;text-align:center;padding:6px 18px 16px}
 .hero .cv{width:60vw;max-width:240px;height:60vw;max-height:240px}
 .actions{padding:0 18px 10px;justify-content:center}
 .list{padding:0 6px 30px}
 .row{grid-template-columns:1fr auto;padding:8px 10px}
 .row .n,.row .pl,.row.hd,.row .d{display:none!important}
 .row .ac button:not(.keep){display:none}
 #tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#000d;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:6px 4px calc(6px + var(--safe-b));justify-content:space-around;border-top:1px solid #ffffff14}
 #tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);padding:4px 10px;flex:1}
 #tabs button svg{font-size:24px}
 #tabs button.on{color:var(--text)}
 #mini{display:flex;position:fixed;left:8px;right:8px;bottom:calc(58px + var(--safe-b));z-index:21;background:#2a2a2a;border-radius:10px;padding:8px 10px;align-items:center;gap:10px;box-shadow:0 4px 20px #0008}
 #mini.off{display:none}
 #mini .cv{width:42px;height:42px;border-radius:5px;flex:none;display:grid;place-items:center;font-size:18px}
 #mini .mt{flex:1;min-width:0}
 #mini .mt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #mini .mt span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #mini .icon{font-size:26px;color:var(--text)}
 #mini .prog{position:absolute;left:10px;right:10px;bottom:0;height:2px;background:#ffffff33;border-radius:2px}
 #mini .prog i{display:block;height:100%;background:#fff;border-radius:2px;width:0}
 #full{display:flex;flex-direction:column;position:fixed;inset:0;z-index:40;padding:calc(14px + var(--safe-t)) 24px calc(24px + var(--safe-b));transform:translateY(100%);transition:transform .3s ease;background:#222}
 #full.on{transform:none}
 #full .fh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}
 #full .fh .icon{font-size:28px;color:var(--text)}
 #full .fc{flex:1;display:grid;place-items:center;padding:16px 0}
 #full .fc .cv{width:min(82vw,52vh);height:min(82vw,52vh);border-radius:10px;display:grid;place-items:center;font-size:90px;box-shadow:0 16px 50px #0008}
 #full .ft{display:flex;align-items:center;gap:10px;margin-bottom:12px}
 #full .ft div{flex:1;min-width:0}
 #full .ft b{display:block;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #full .ft span{color:var(--muted);font-size:15px}
 #full .ft .icon{font-size:28px}
 #full .seek{max-width:none;margin-bottom:14px}
 #full input[type=range]{height:6px}
 #full input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
 #full .btns{justify-content:space-between;padding:0 4px}
 #full .btns .icon{font-size:26px}
 #full .btns .pp{width:68px;height:68px;font-size:32px}
 .toast{bottom:calc(130px + var(--safe-b))}
}
</style>
</head>
<body>
<div id="app">
 <aside id="side"></aside>
 <main id="main"></main>
 <footer id="bar"></footer>
</div>
<nav id="tabs"></nav>
<div id="mini" class="off"></div>
<section id="full"></section>
<div class="drop" id="drop">Rilascia qui i brani</div>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.flac,.wav,.ogg,.aac" multiple hidden>
<audio id="au" preload="auto" playsinline></audio>

<script>
/* ---------- icone ---------- */
const I={
 home:'<svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>',
 search:'<svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>',
 lib:'<svg viewBox="0 0 24 24"><path d="M4 4h2v16H4zm5 0h2v16H9zm4.5.5 1.9-.5 4.1 15.5-1.9.5z"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M12 21 10.6 19.7C5.4 15 2 11.900 2 8.500 2 5.700 4.200 3.500 7 3.500c1.600 0 3.100.7 4 1.900.9-1.200 2.400-1.900 4-1.900 2.800 0 5 2.200 5 5 0 3.400-3.400 6.500-8.600 11.200z"/></svg>',
 heartO:'<svg viewBox="0 0 24 24"><path d="M16.500 3.500c-1.700 0-3.400.8-4.500 2.100C10.900 4.300 9.200 3.500 7.500 3.500 4.400 3.500 2 5.900 2 9c0 3.800 3.400 6.900 8.600 11.600L12 21.900l1.400-1.300C18.600 15.900 22 12.800 22 9c0-3.100-2.400-5.500-5.500-5.500zm-4.400 15.600-.1.100-.1-.1C7.100 14.800 4 12 4 9c0-2 1.500-3.500 3.500-3.500 1.500 0 3 1 3.600 2.400h1.800c.5-1.400 2-2.400 3.600-2.400 2 0 3.500 1.500 3.500 3.500 0 3-3.100 5.800-7.900 10.100z"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>',
 play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
 pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
 next:'<svg viewBox="0 0 24 24"><path d="M6 18l8.500-6L6 6zm10-12v12h2V6z"/></svg>',
 prev:'<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.500 6 8.500 6V6z"/></svg>',
 shuf:'<svg viewBox="0 0 24 24"><path d="M10.600 9.200 5.400 4 4 5.400l5.200 5.200zM14.500 4l2.050 2.050L4 18.600 5.400 20 18 7.450 20 9.500V4zm.3 9.400-1.400 1.400 3.150 3.150L14.500 20H20v-5.500l-2.050 2.050z"/></svg>',
 rep:'<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>',
 down:'<svg viewBox="0 0 24 24"><path d="M7.400 8.600 12 13.200l4.600-4.600L18 10l-6 6-6-6z"/></svg>',
 trash:'<svg viewBox="0 0 24 24"><path d="M6 19c0 1.100.9 2 2 2h8c1.100 0 2-.9 2-2V7H6zM19 4h-3.500l-1-1h-5l-1 1H5v2h14z"/></svg>',
 vol:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.500 3A4.500 4.500 0 0 0 14 8v8a4.500 4.500 0 0 0 2.500-4z"/></svg>',
 note:'<svg viewBox="0 0 24 24"><path d="M12 3v10.600A4 4 0 1 0 14 17V7h4V3z"/></svg>',
 dots:'<svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>',
 dl:'<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z"/></svg>',
 folder:'<svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/></svg>'
};
const $=s=>document.querySelector(s);

/* ---------- archivio (IndexedDB con fallback in memoria) ---------- */
const mem={tracks:new Map(),playlists:new Map(),meta:new Map()};
let db=null;
function openDB(){return new Promise(res=>{
 try{const r=indexedDB.open('musica-privata',2);
  r.onupgradeneeded=()=>{const d=r.result;for(const s of ['tracks','playlists','meta'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})};
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res();r.onblocked=()=>res();
 }catch(e){res()}})}
function dbAll(s){return new Promise(res=>{if(!db)return res([...mem[s].values()]);
 try{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])}catch(e){res([])}})}
function dbPut(s,v){mem[s].set(v.id,v);if(!db)return Promise.resolve();
 return new Promise(res=>{try{const t=db.transaction(s,'readwrite');t.objectStore(s).put(v);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
function dbDel(s,id){mem[s].delete(id);if(!db)return Promise.resolve();
 return new Promise(res=>{try{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=res;t.onerror=res}catch(e){res()}})}

/* ---------- stato ---------- */
const S={tracks:[],pl:[],view:'all',q:'',queue:[],cur:null,playing:false,shuffle:false,repeat:0,url:null,full:false};
const au=$('#au');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function cover(t,cls=''){const h=hue(t.title+t.artist);return `<div class="cv ${cls}" style="background:linear-gradient(135deg,hsl(${h} 60% 38%),hsl(${(h+50)%360} 70% 22%))">${I.note}</div>`}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
const byId=id=>S.tracks.find(t=>t.id===id);

function parseName(n){
 n=n.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
 const m=n.match(/^(.+?)\s+-\s+(.+)$/);
 return m?{artist:m[1].trim(),title:m[2].trim()}:{artist:'Artista sconosciuto',title:n};
}
function getDuration(blob){return new Promise(res=>{
 const a=new Audio(),u=URL.createObjectURL(blob);let done=false;
 const end=d=>{if(done)return;done=true;URL.revokeObjectURL(u);res(d)};
 a.preload='metadata';a.onloadedmetadata=()=>end(a.duration);a.onerror=()=>end(0);setTimeout(()=>end(0),4000);a.src=u})}

async function addFiles(files){
 const list=[...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|flac|wav|ogg|aac|opus)$/i.test(f.name));
 if(!list.length){toast('Nessun file audio trovato');return}
 let n=0;
 for(const f of list){
  if(S.tracks.some(t=>t.file===f.name&&t.size===f.size))continue;
  const p=parseName(f.name);
  const t={id:uid(),file:f.name,size:f.size,title:p.title,artist:p.artist,duration:await getDuration(f),liked:false,added:Date.now(),blob:f};
  S.tracks.push(t);await dbPut('tracks',t);n++;
 }
 toast(n?`${n} ${n===1?'brano aggiunto':'brani aggiunti'}`:'Già presenti');
 render();
}

/* ---------- salvataggio su File e import da link ---------- */
const mimeOf=n=>({mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/ogg'}[(n.split('.').pop()||'').toLowerCase()]||'audio/mpeg');
const fileOf=t=>new File([t.blob],t.file,{type:t.blob.type||mimeOf(t.file)});
let dirHandle=null;
async function loadDir(){try{const m=(await dbAll('meta')).find(x=>x.id==='dir');if(m)dirHandle=m.handle}catch(e){}}
async function pickDir(){
 if(!window.showDirectoryPicker){toast('Su iPhone la cartella si sceglie in File, dal foglio di salvataggio');return false}
 try{dirHandle=await showDirectoryPicker({mode:'readwrite',id:'musica'});await dbPut('meta',{id:'dir',handle:dirHandle});toast('Cartella scelta: '+dirHandle.name);return true}catch(e){return false}
}
async function saveTracks(list){
 if(!list.length)return;
 const files=list.map(fileOf);
 /* iPhone e telefoni: foglio di condivisione, poi "Salva su File" e scegli la cartella */
 if(navigator.canShare&&navigator.canShare({files})){
  try{await navigator.share({files})}catch(e){if(e.name!=='AbortError')toast('Condivisione non riuscita')}
  return;
 }
 /* PC con Chrome/Edge: scrive direttamente nella cartella scelta */
 if(window.showDirectoryPicker){
  if(!dirHandle&&!(await pickDir()))return;
  try{
   let perm=await dirHandle.queryPermission({mode:'readwrite'});
   if(perm!=='granted')perm=await dirHandle.requestPermission({mode:'readwrite'});
   if(perm!=='granted'){toast('Permesso negato');return}
   for(const f of files){const h=await dirHandle.getFileHandle(f.name,{create:true});const w=await h.createWritable();await w.write(f);await w.close()}
   toast(`${files.length} ${files.length===1?'brano salvato':'brani salvati'} in "${dirHandle.name}"`);
  }catch(e){toast('Errore nel salvataggio')}
  return;
 }
 /* ripiego: download normale del browser */
 for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
}
async function addFromUrl(){
 const u=prompt('Incolla il link diretto a un file audio (MP3, M4A, FLAC, WAV…)');if(!u)return;
 let url;try{url=new URL(u.trim())}catch(e){toast('Link non valido');return}
 toast('Scarico il file…');
 try{
  const r=await fetch(url);if(!r.ok)throw new Error('http');
  const b=await r.blob();
  let name=decodeURIComponent(url.pathname.split('/').pop()||'brano');
  if(!/\.[a-z0-9]{2,5}$/i.test(name))name+='.'+({'audio/mpeg':'mp3','audio/mp4':'m4a','audio/aac':'aac','audio/flac':'flac','audio/wav':'wav','audio/ogg':'ogg'}[b.type]||'mp3');
  if(!b.type.startsWith('audio/')&&!/\.(mp3|m4a|flac|wav|ogg|aac|opus)$/i.test(name)){toast('Il link non punta a un file audio');return}
  await addFiles([new File([b],name,{type:b.type||mimeOf(name)})]);
 }catch(e){toast('Download non riuscito: il sito potrebbe bloccarlo')}
}

/* ---------- viste ---------- */
function viewTracks(){
 let l=S.tracks.slice();
 if(S.view==='liked')l=l.filter(t=>t.liked);
 else if(S.view.startsWith('pl:')){const p=S.pl.find(x=>x.id===S.view.slice(3));l=p?p.tracks.map(byId).filter(Boolean):[]}
 else l.sort((a,b)=>b.added-a.added);
 if(S.q){const q=S.q.toLowerCase();l=l.filter(t=>(t.title+' '+t.artist).toLowerCase().includes(q))}
 return l;
}
function viewInfo(){
 if(S.view==='liked')return{name:'Brani che ti piacciono',kind:'Playlist',icon:I.heart};
 if(S.view.startsWith('pl:')){const p=S.pl.find(x=>x.id===S.view.slice(3));return{name:p?p.name:'Playlist',kind:'Playlist',icon:I.lib,pl:p}}
 return{name:'La tua libreria',kind:'Libreria',icon:I.note};
}

function renderSide(){
 $('#side').innerHTML=`<h1><i>${I.note}</i>La mia Musica</h1>
 <button class="nav ${S.view==='all'?'on':''}" data-v="all">${I.home}<span>Libreria</span></button>
 <button class="nav ${S.view==='liked'?'on':''}" data-v="liked">${I.heart}<span>Preferiti</span></button>
 <div class="sep"></div>
 <div class="sidehead">Playlist <button id="newpl" title="Nuova playlist">${I.plus}</button></div>
 ${S.pl.map(p=>`<button class="nav ${S.view==='pl:'+p.id?'on':''}" data-v="pl:${p.id}">${I.lib}<span>${esc(p.name)}</span></button>`).join('')||'<p style="color:var(--muted);font-size:13px;padding:8px 12px">Nessuna playlist</p>'}`;
}
function renderTabs(){
 $('#tabs').innerHTML=`<button class="${S.view==='all'?'on':''}" data-v="all">${I.home}Libreria</button>
 <button class="${S.view==='liked'?'on':''}" data-v="liked">${I.heart}Preferiti</button>
 <button class="${S.view.startsWith('pl:')?'on':''}" id="tabpl">${I.lib}Playlist</button>
 <button id="tabadd">${I.plus}Aggiungi</button>`;
}
function renderMain(){
 const info=viewInfo(),l=viewTracks(),m=$('#main'),st=m.scrollTop;
 const head=`<div class="top"><label class="search">${I.search}<input id="q" placeholder="Cerca brani o artisti" value="${esc(S.q)}"></label><button class="btn g hide-m" id="add">Aggiungi brani</button><button class="btn hide-m" id="addurl">Da link</button></div>`;
 let body;
 if(!S.tracks.length){
  body=`<div class="empty"><h3>La tua libreria è vuota</h3><p>Aggiungi i tuoi MP3, M4A, FLAC o WAV.<br>Su PC puoi anche trascinarli qui sopra.</p><button class="btn g" id="add2">Aggiungi brani</button> <button class="btn" id="addurl2">Da link</button></div>`;
 }else{
  const dur=l.reduce((a,t)=>a+(t.duration||0),0);
  body=`<div class="hero">${S.view==='all'||S.view==='liked'?`<div class="cv" style="background:linear-gradient(135deg,${S.view==='liked'?'#4b2fd8,#a7c5f0':'#1ed760,#0b5a2a'})">${info.icon}</div>`:cover({title:info.name,artist:''})}
  <div><small>${info.kind}</small><h2>${esc(info.name)}</h2><p>${l.length} ${l.length===1?'brano':'brani'}${dur?' · '+Math.round(dur/60)+' min':''}</p></div></div>
  <div class="actions"><button class="play-big" id="playall" ${l.length?'':'disabled'}>${I.play}</button>
  <button class="icon ${S.shuffle?'on':''}" id="shufv" title="Casuale">${I.shuf}</button>
  <button class="icon" id="savev" title="Salva su File">${I.dl}</button>
  ${window.showDirectoryPicker?`<button class="icon" id="pickdir" title="Scegli la cartella di salvataggio${dirHandle?' (ora: '+esc(dirHandle.name)+')':''}">${I.folder}</button>`:''}
  ${info.pl?`<button class="icon" id="delpl" title="Elimina playlist">${I.trash}</button>`:''}</div>
  <div class="list"><div class="row hd"><span class="n">#</span><span>Titolo</span><span class="d">Durata</span><span></span></div>
  ${l.map((t,i)=>row(t,i,info)).join('')||'<div class="empty"><p>Nessun brano qui.</p></div>'}</div>`;
 }
 m.innerHTML=head+body;m.scrollTop=st;
 const q=$('#q');if(q)q.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;renderMain();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
}
function row(t,i,info){
 const cur=S.cur===t.id;
 return `<div class="row ${cur?'cur':''}" data-id="${t.id}">
 <span class="n">${cur&&S.playing?'♪':i+1}</span><button class="pl" data-a="play">${I.play}</button>
 <div class="t" data-a="play">${cover(t)}<div><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div></div>
 <span class="d">${fmt(t.duration)}</span>
 <div class="ac"><button class="${t.liked?'on':''}" data-a="like" title="Preferito">${t.liked?I.heart:I.heartO}</button>
 <button class="keep" data-a="menu" title="Altro">${I.dots}</button></div></div>`;
}

/* ---------- player ---------- */
function npHTML(t){return t?`${cover(t)}<div><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div>`:'<div><span>Scegli un brano</span></div>'}
function renderBar(){
 const t=byId(S.cur);
 $('#bar').innerHTML=`<div class="np">${npHTML(t)}${t?`<button class="icon ${t.liked?'on':''}" data-a="likecur">${t.liked?I.heart:I.heartO}</button>`:''}</div>
 <div class="ctl"><div class="btns">
  <button class="icon ${S.shuffle?'on':''}" data-a="shuf">${I.shuf}</button>
  <button class="icon" data-a="prev">${I.prev}</button>
  <button class="pp" data-a="pp">${S.playing?I.pause:I.play}</button>
  <button class="icon" data-a="next">${I.next}</button>
  <button class="icon ${S.repeat?'on':''}" data-a="rep" title="${['Ripeti: no','Ripeti tutto','Ripeti brano'][S.repeat]}">${I.rep}${S.repeat===2?'<small style="position:absolute;font-size:9px;margin:-22px 0 0 10px">1</small>':''}</button></div>
  <div class="seek"><span id="tc">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="td">0:00</span></div></div>
 <div class="vol"><span style="font-size:20px;color:var(--muted)">${I.vol}</span><input type="range" id="vl" min="0" max="100" value="${Math.round(au.volume*100)}"></div>`;
 setProg();
}
function renderMobile(){
 const t=byId(S.cur),m=$('#mini');
 m.classList.toggle('off',!t);
 m.innerHTML=t?`${cover(t)}<div class="mt" data-a="open"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div>
 <button class="icon" data-a="pp">${S.playing?I.pause:I.play}</button><button class="icon" data-a="next">${I.next}</button><div class="prog"><i id="mp"></i></div>`:'';
 $('#full').innerHTML=t?`<div class="fh"><button class="icon" data-a="close">${I.down}</button><span>In riproduzione</span><span style="width:28px"></span></div>
 <div class="fc">${cover(t)}</div>
 <div class="ft"><div><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div><button class="icon ${t.liked?'on':''}" data-a="likecur">${t.liked?I.heart:I.heartO}</button></div>
 <div class="seek"><span id="fc">0:00</span><input type="range" id="fsk" min="0" max="1000" value="0"><span id="fd">0:00</span></div>
 <div class="btns"><button class="icon ${S.shuffle?'on':''}" data-a="shuf">${I.shuf}</button><button class="icon" data-a="prev">${I.prev}</button><button class="pp" data-a="pp">${S.playing?I.pause:I.play}</button><button class="icon" data-a="next">${I.next}</button><button class="icon ${S.repeat?'on':''}" data-a="rep">${I.rep}</button></div>`:'';
 $('#full').classList.toggle('on',S.full&&!!t);
 setProg();
}
function setProg(){
 const d=au.duration||byId(S.cur)?.duration||0,c=au.currentTime||0,p=d?Math.min(1000,c/d*1000):0;
 for(const [s,a,b] of [['#sk','#tc','#td'],['#fsk','#fc','#fd']]){
  const e=$(s);if(!e)continue;
  if(!e.dataset.drag){e.value=p;e.style.setProperty('--p',p/10+'%')}
  $(a).textContent=fmt(c);$(b).textContent=fmt(d);
 }
 const mp=$('#mp');if(mp)mp.style.width=p/10+'%';
 const v=$('#vl');if(v)v.style.setProperty('--p',v.value+'%');
}
function render(){renderSide();renderTabs();renderMain();renderBar();renderMobile()}
function refreshPlayerUI(){renderBar();renderMobile();document.querySelectorAll('.row').forEach(r=>{r.classList.toggle('cur',r.dataset.id===S.cur);const n=r.querySelector('.n');if(n&&r.dataset.id===S.cur)n.textContent=S.playing?'♪':n.textContent})}

function load(id,autoplay=true){
 const t=byId(id);if(!t)return;
 if(S.url)URL.revokeObjectURL(S.url);
 S.url=URL.createObjectURL(t.blob);au.src=S.url;S.cur=id;
 if(autoplay)au.play().catch(()=>{});
 mediaSession(t);refreshPlayerUI();
}
function playList(list,id){
 S.queue=list.map(t=>t.id);
 load(id||(S.shuffle?S.queue[Math.floor(Math.random()*S.queue.length)]:S.queue[0]));
}
function next(auto){
 if(!S.queue.length)return;
 let i=S.queue.indexOf(S.cur);
 if(S.shuffle&&S.queue.length>1){let n;do{n=Math.floor(Math.random()*S.queue.length)}while(n===i);return load(S.queue[n])}
 if(i<S.queue.length-1)return load(S.queue[i+1]);
 if(S.repeat===1)return load(S.queue[0]);
 if(auto){au.pause();au.currentTime=0}else load(S.queue[0],false);
}
function prev(){
 if(au.currentTime>3){au.currentTime=0;return}
 const i=S.queue.indexOf(S.cur);
 if(i>0)load(S.queue[i-1]);else au.currentTime=0;
}
function toggle(){if(!S.cur)return;au.paused?au.play().catch(()=>{}):au.pause()}
au.onplay=()=>{S.playing=true;refreshPlayerUI();navigator.mediaSession&&(navigator.mediaSession.playbackState='playing')};
au.onpause=()=>{S.playing=false;refreshPlayerUI();navigator.mediaSession&&(navigator.mediaSession.playbackState='paused')};
au.ontimeupdate=setProg;au.onloadedmetadata=setProg;
au.onended=()=>{S.repeat===2?(au.currentTime=0,au.play()):next(true)};
function mediaSession(t){
 if(!('mediaSession' in navigator))return;
 navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:'La mia Musica'});
 const h={play:toggle,pause:toggle,previoustrack:prev,nexttrack:()=>next(false),
  seekto:e=>{au.currentTime=e.seekTime}};
 for(const k in h){try{navigator.mediaSession.setActionHandler(k,h[k])}catch(e){}}
}

/* ---------- azioni ---------- */
async function like(id){const t=byId(id);if(!t)return;t.liked=!t.liked;await dbPut('tracks',t);render()}
async function newPlaylist(){
 const n=prompt('Nome della playlist');if(!n||!n.trim())return null;
 const p={id:uid(),name:n.trim(),tracks:[]};S.pl.push(p);await dbPut('playlists',p);return p;
}
function popup(x,y,html,onclick){
 closePop();const p=document.createElement('div');p.className='pop';p.innerHTML=html;document.body.appendChild(p);
 const w=p.offsetWidth,h=p.offsetHeight;
 p.style.left=Math.max(8,Math.min(x,innerWidth-w-8))+'px';p.style.top=Math.max(8,Math.min(y,innerHeight-h-8))+'px';
 p.onclick=e=>{const b=e.target.closest('button');if(b){onclick(b.dataset);closePop()}};
}
function closePop(){document.querySelectorAll('.pop').forEach(e=>e.remove())}
function trackMenu(id,x,y){
 const inPl=S.view.startsWith('pl:');
 popup(x,y,`<div class="lbl">Aggiungi a playlist</div>${S.pl.map(p=>`<button data-k="add" data-p="${p.id}">${esc(p.name)}</button>`).join('')}
 <button data-k="newadd">+ Nuova playlist</button>${inPl?'<button data-k="rmpl">Rimuovi da questa playlist</button>':''}<button data-k="save">${navigator.canShare&&!window.showDirectoryPicker?'Salva su File':'Salva nella cartella'}</button><button data-k="del" style="color:#ff6b6b">Elimina dalla libreria</button>`,
 async d=>{
  const t=byId(id);
  if(d.k==='save'){saveTracks([t]);return}
  if(d.k==='add'){const p=S.pl.find(x=>x.id===d.p);if(!p.tracks.includes(id)){p.tracks.push(id);await dbPut('playlists',p);toast('Aggiunto a '+p.name)}else toast('Già nella playlist')}
  if(d.k==='newadd'){const p=await newPlaylist();if(p){p.tracks.push(id);await dbPut('playlists',p);toast('Aggiunto a '+p.name);render()}}
  if(d.k==='rmpl'){const p=S.pl.find(x=>x.id===S.view.slice(3));p.tracks=p.tracks.filter(x=>x!==id);await dbPut('playlists',p);render()}
  if(d.k==='del'){if(!confirm(`Eliminare "${t.title}" dalla libreria?`))return;
   if(S.cur===id){au.pause();au.removeAttribute('src');S.cur=null;S.playing=false;S.full=false}
   S.tracks=S.tracks.filter(x=>x.id!==id);S.queue=S.queue.filter(x=>x!==id);await dbDel('tracks',id);
   for(const p of S.pl){if(p.tracks.includes(id)){p.tracks=p.tracks.filter(x=>x!==id);await dbPut('playlists',p)}}render()}
 });
}
function setView(v){S.view=v;S.q='';$('#main').scrollTop=0;render()}

/* ---------- eventi ---------- */
document.addEventListener('click',async e=>{
 const a=e.target.closest('[data-a]'),v=e.target.closest('[data-v]'),id=e.target.id||e.target.closest('button[id]')?.id;
 if(!e.target.closest('.pop'))closePop();
 if(v){setView(v.dataset.v);return}
 if(a){
  const act=a.dataset.a,r=a.closest('.row'),rid=r?.dataset.id;
  if(act==='play')playList(viewTracks(),rid);
  else if(act==='like')like(rid);
  else if(act==='menu'){const b=a.getBoundingClientRect();trackMenu(rid,b.left-170,b.bottom);e.stopPropagation()}
  else if(act==='likecur')like(S.cur);
  else if(act==='pp')toggle();
  else if(act==='next')next(false);
  else if(act==='prev')prev();
  else if(act==='shuf'){S.shuffle=!S.shuffle;render()}
  else if(act==='rep'){S.repeat=(S.repeat+1)%3;render()}
  else if(act==='open'){S.full=true;renderMobile()}
  else if(act==='close'){S.full=false;renderMobile()}
  return;
 }
 const bt=e.target.closest('button');if(!bt)return;
 const bid=bt.id;
 if(bid==='add'||bid==='add2')$('#file').click();
 else if(bid==='addurl'||bid==='addurl2')addFromUrl();
 else if(bid==='savev'){const l=viewTracks();if(l.length)saveTracks(l);else toast('Nessun brano da salvare')}
 else if(bid==='pickdir')pickDir().then(()=>renderMain());
 else if(bid==='tabadd'){const b=bt.getBoundingClientRect();popup(b.left-30,b.top-110,`<button data-k="file">Da file</button><button data-k="url">Da link</button>`,d=>{if(d.k==='file')$('#file').click();else addFromUrl()})}
 else if(bid==='newpl'){const p=await newPlaylist();if(p){S.view='pl:'+p.id;render()}}
 else if(bid==='playall'){const l=viewTracks();if(l.length)playList(l)}
 else if(bid==='shufv'){S.shuffle=!S.shuffle;render()}
 else if(bid==='delpl'){const p=S.pl.find(x=>x.id===S.view.slice(3));if(p&&confirm(`Eliminare la playlist "${p.name}"? I brani restano nella libreria.`)){S.pl=S.pl.filter(x=>x!==p);await dbDel('playlists',p.id);S.view='all';render()}}
 else if(bid==='tabpl'){
  const b=bt.getBoundingClientRect();
  popup(b.left,b.top-20-Math.min(300,(S.pl.length+2)*42),`<div class="lbl">Le tue playlist</div>${S.pl.map(p=>`<button data-k="go" data-p="${p.id}">${esc(p.name)}</button>`).join('')||'<div class="lbl" style="text-transform:none">Ancora nessuna</div>'}<button data-k="new">+ Nuova playlist</button>`,
   async d=>{if(d.k==='go')setView('pl:'+d.p);if(d.k==='new'){const p=await newPlaylist();if(p){S.view='pl:'+p.id;render()}}});
  e.stopPropagation();
 }
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='sk'||t.id==='fsk'){t.dataset.drag=1;t.style.setProperty('--p',t.value/10+'%')}
 if(t.id==='vl'){au.volume=t.value/100;t.style.setProperty('--p',t.value+'%')}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='sk'||t.id==='fsk'){delete t.dataset.drag;const d=au.duration;if(d)au.currentTime=t.value/1000*d}
 if(t.id==='file'){addFiles(t.files);t.value=''}
});
document.addEventListener('keydown',e=>{
 if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.type!=='range')return;
 if(e.code==='Space'){e.preventDefault();toggle()}
 if(e.code==='ArrowRight'&&e.shiftKey)next(false);
 if(e.code==='ArrowLeft'&&e.shiftKey)prev();
});
let dc=0;
addEventListener('dragenter',e=>{e.preventDefault();dc++;$('#drop').classList.add('on')});
addEventListener('dragleave',e=>{dc--;if(dc<=0){dc=0;$('#drop').classList.remove('on')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;$('#drop').classList.remove('on');if(e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

/* ---------- avvio ---------- */
(async()=>{
 await openDB();
 S.tracks=await dbAll('tracks');S.pl=await dbAll('playlists');await loadDir();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 render();
})();
</script>
</body>
